<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Interativo — Parque Realengo Jornalista Susana Naspolini</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="map-header">
    <div class="map-logo">
      <span class="logo-badge">GEO</span>
      <h1>Parque Realengo Susana Naspolini</h1>
    </div>
    <div class="status-badge">
      <span>● Parque Aberto • 06h às 22h</span>
    </div>
  </header>

  <!-- Layout Principal -->
  <main class="map-layout">
    
    <!-- Sidebar de Pontos de Interesse -->
    <aside class="map-sidebar">
      <div class="sidebar-header">
        <div id="map-category-pills" class="category-pills">
          <!-- Injetado via app.js -->
        </div>
      </div>
      <div id="pois-list" class="pois-list">
        <!-- Injetado via app.js -->
      </div>
    </aside>

    <!-- Canvas do Mapa -->
    <section class="map-canvas-container">
      <canvas id="park-map-canvas"></canvas>

      <!-- Controles Flutuantes -->
      <div class="floating-map-controls">
        <button id="btn-zoom-in" class="map-control-btn" title="Aproximar">+</button>
        <button id="btn-zoom-out" class="map-control-btn" title="Afastar">-</button>
        <button id="btn-reset-map" class="map-control-btn" title="Centralizar">⟲</button>
      </div>

      <!-- Drawer de Detalhes do Ponto Clicado -->
      <div id="poi-drawer" class="poi-drawer">
        <div class="drawer-header">
          <h3 id="drawer-title">Super-Torre Central 02</h3>
          <button id="btn-close-drawer" class="btn-close-drawer">&times;</button>
        </div>
        <div id="drawer-status" class="drawer-status">Ativa | Pulverização Térmica</div>
        <p id="drawer-desc" class="drawer-desc">Descrição detalhada do local.</p>
        <ul id="drawer-highlights" class="drawer-highlights"></ul>
        <div id="drawer-access" class="drawer-access">Acessibilidade garantida</div>
      </div>

    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
