  <rect x="250" y="380" width="160" height="700" fill="#162238"/>
  <rect x="440" y="320" width="140" height="760" fill="#0f172a"/>
  <rect x="610" y="400" width="180" height="680" fill="#1e293b"/>
  <rect x="820" y="280" width="200" height="800" fill="#0d1627"/>
